name: Monitor LEGO

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-lego
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el navegador automático
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Consultar los dos sets
        id: monitor
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar el último estado
        if: always() && steps.monitor.outcome != 'skipped'
        run: |
          if [ -f estado.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add estado.json

            if ! git diff --cached --quiet; then
              git commit -m "Actualizar estados LEGO"
              git push
            fi
          fi

      - name: Señalar si hubo errores
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "El monitor tuvo un error. Revisa el paso Consultar los dos sets."
          exit 1
